<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thembulls Tow Run</title><style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif;text-align:center}header{padding:14px;background:#000;border-bottom:3px solid #f4b400}h1{margin:0;color:#f4b400;font-size:clamp(24px,6vw,40px)}p{margin:6px}.wrap{max-width:900px;margin:auto;padding:14px}canvas{width:100%;max-height:62vh;background:#18232c;border:3px solid #f4b400;border-radius:14px;touch-action:none}.hud{display:flex;justify-content:space-around;font-weight:bold;margin:8px}.controls{display:grid;grid-template-columns:repeat(3,74px);gap:8px;justify-content:center;margin:14px}.controls button{height:58px;border:0;border-radius:12px;background:#f4b400;font-size:25px;font-weight:bold}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}.back{color:#f4b400;font-weight:bold;text-decoration:none}
</style></head><body><header><h1>THEMBULLS TOW RUN</h1><p>Reach the stranded car before time runs out!</p></header><main class="wrap"><div class="hud"><span>Score: <b id="score">0</b></span><span>Time: <b id="time">45</b></span></div><canvas id="game" width="800" height="500"></canvas><div class="controls"><button class="up" data-k="ArrowUp">▲</button><button class="left" data-k="ArrowLeft">◀</button><button class="down" data-k="ArrowDown">▼</button><button class="right" data-k="ArrowRight">▶</button></div><a class="back" href="index.html">← Back to Thembulls Towing</a></main><script>
const c=document.querySelector('#game'),x=c.getContext('2d'),keys={},truck={x:90,y:390,a:0},car={x:650,y:100};let score=0,time=45,over=false;
function resetCar(){car.x=100+Math.random()*600;car.y=70+Math.random()*330}
function road(){let g=x.createLinearGradient(0,0,0,500);g.addColorStop(0,'#5e89ad');g.addColorStop(.43,'#b8d4e7');g.addColorStop(.44,'#4c7b39');g.addColorStop(.55,'#4c7b39');g.addColorStop(.56,'#3b3b3b');g.addColorStop(1,'#171717');x.fillStyle=g;x.fillRect(0,0,800,500);x.strokeStyle='#f4b400';x.lineWidth=5;x.setLineDash([35,25]);x.beginPath();x.moveTo(0,330);x.lineTo(800,330);x.stroke();x.setLineDash([])}
function tow(t){x.save();x.translate(t.x,t.y);x.rotate(t.a);x.fillStyle='#f4b400';x.fillRect(-36,-22,72,38);x.fillStyle='#111';x.fillRect(-30,-17,27,17);x.fillStyle='#eee';x.fillRect(-27,-14,21,11);x.fillStyle='#111';x.beginPath();x.arc(-23,19,10,0,7);x.arc(24,19,10,0,7);x.fill();x.fillStyle='#000';x.font='bold 10px Arial';x.fillText('THEMBULLS',-3,5);x.restore()}
function stranded(){x.fillStyle='#d73535';x.fillRect(car.x-27,car.y-14,54,28);x.fillStyle='#111';x.beginPath();x.arc(car.x-17,car.y+15,8,0,7);x.arc(car.x+17,car.y+15,8,0,7);x.fill();x.fillStyle='#fff';x.font='bold 14px Arial';x.fillText('HELP!',car.x-21,car.y-26)}
function loop(){road();if(!over){if(keys.ArrowLeft)truck.a-=.06;if(keys.ArrowRight)truck.a+=.06;let v=(keys.ArrowUp?4:0)-(keys.ArrowDown?2:0);truck.x=Math.max(35,Math.min(765,truck.x+Math.cos(truck.a)*v));truck.y=Math.max(45,Math.min(465,truck.y+Math.sin(truck.a)*v));if(Math.hypot(truck.x-car.x,truck.y-car.y)<48){score++;document.querySelector('#score').textContent=score;resetCar()}}stranded();tow(truck);if(over){x.fillStyle='#000c';x.fillRect(0,0,800,500);x.fillStyle='#f4b400';x.font='bold 48px Arial';x.textAlign='center';x.fillText('SHIFT COMPLETE!',400,220);x.fillStyle='#fff';x.font='28px Arial';x.fillText('Cars rescued: '+score,400,270);x.font='20px Arial';x.fillText('Tap here to play again',400,315)}requestAnimationFrame(loop)}
addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('button').forEach(b=>{const k=b.dataset.k;b.onpointerdown=()=>keys[k]=true;b.onpointerup=b.onpointercancel=()=>keys[k]=false});c.onclick=()=>{if(over){score=0;time=45;over=false;truck.x=90;truck.y=390;document.querySelector('#score').textContent=0;resetCar()}};setInterval(()=>{if(!over&&--time<=0)over=true;document.querySelector('#time').textContent=time},1000);loop();
</script></body></html>
